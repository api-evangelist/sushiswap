name: SushiSwap
description: SushiSwap is a multi-chain decentralized exchange (DEX) protocol offering
  REST APIs for accessing liquidity pools, token prices, swap quotes, trading routes,
  and exchange analytics across 30+ blockchain networks. The Sushi API suite enables
  developers to integrate token pricing, generate swap quotes, and execute on-chain
  transactions programmatically via a unified base URL with per-chain routing.
